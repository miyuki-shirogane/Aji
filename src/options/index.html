<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Aji 设置</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1f2328; }
      h1 { font-size: 18px; }
      label { display: block; margin: 16px 0 6px; font-weight: 600; }
      input { width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 13px; border: 1px solid #d0d7de; border-radius: 8px; }
      button { margin-top: 14px; padding: 8px 16px; font-size: 13px; border: 1px solid #0969da; background: #0969da; color: #fff; border-radius: 8px; cursor: pointer; }
      #msg { margin-left: 10px; color: #1a7f37; }
      p.note { color: #656d76; font-size: 12px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <h1>Aji 设置</h1>
    <label for="pat">GitHub Personal Access Token（可选）</label>
    <input id="pat" type="password" placeholder="ghp_..." autocomplete="off" />
    <button id="save">保存</button>
    <span id="msg"></span>
    <p class="note">
      未配置 Token 时使用匿名访问（60 次/小时），仅够索引很小的仓库。<br />
      配置 fine-grained PAT（只需公开仓库读取权限）可将配额提升到 5000 次/小时。<br />
      Token 仅保存在本机浏览器存储中，只用于访问 api.github.com。
    </p>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
